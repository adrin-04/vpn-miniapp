<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Import</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f7);
            color: var(--tg-theme-text-color, #1c1c1e);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 24px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h2 { margin-top: 0; margin-bottom: 8px; font-size: 22px; }
        p { font-size: 14px; opacity: 0.7; margin-bottom: 20px; }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin-bottom: 12px;
        }
        .btn-happ {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background-color: #007aff;
            color: white;
            transition: opacity 0.2s ease;
        }
        .btn-happ:active { opacity: 0.8; }
        .hint {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Happ App Import</h2>
        <p>Kopiere deinen Subscription-Link und tippe unten</p>

        <input type="text" id="link-input" placeholder="Wird automatisch eingefügt...">

        <button class="btn-happ" id="importBtn">📋 Einfügen &amp; in Happ importieren</button>
        <p class="hint" id="hint">Konnte nichts aus der Zwischenablage lesen. Bitte Link manuell ins Feld einfügen und nochmal tippen.</p>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const input = document.getElementById('link-input');
    const hint = document.getElementById('hint');

    // Zuletzt genutzten Link wiederherstellen (falls vorhanden)
    const savedUrl = localStorage.getItem('vpn_sub_url');
    if (savedUrl) input.value = savedUrl;

    function looksLikeLink(text) {
        return typeof text === 'string' && /^https?:\/\//i.test(text.trim());
    }

    function tryReadClipboard(callback) {
        if (tg.readTextFromClipboard) {
            tg.readTextFromClipboard((text) => {
                if (looksLikeLink(text)) {
                    callback(text);
                } else if (navigator.clipboard && navigator.clipboard.readText) {
                    navigator.clipboard.readText().then(callback).catch(() => callback(null));
                } else {
                    callback(null);
                }
            });
        } else if (navigator.clipboard && navigator.clipboard.readText) {
            navigator.clipboard.readText().then(callback).catch(() => callback(null));
        } else {
            callback(null);
        }
    }

    function goToHapp(subLink) {
        localStorage.setItem('vpn_sub_url', subLink);

        let happLink = subLink;
        if (!happLink.startsWith("happ://add/")) {
            happLink = "happ://add/" + subLink;
        }

        const bridgeUrl = 'https://adrin-04.github.io/vpn-miniapp/redirect.html?url=' + encodeURIComponent(happLink);
        tg.openLink(bridgeUrl, { try_instant_view: false, try_browser: 'chrome' });
    }

    // EIN Klick = Zwischenablage lesen + direkt importieren
    document.getElementById('importBtn').addEventListener('click', () => {
        hint.style.display = 'none';

        tryReadClipboard((clipText) => {
            let subLink;

            if (looksLikeLink(clipText)) {
                // Frischer Link aus der Zwischenablage gefunden -> nutzen
                subLink = clipText.trim();
                input.value = subLink;
            } else {
                // Fallback: nimm, was schon manuell im Feld steht
                subLink = input.value.trim();
            }

            if (!subLink) {
                hint.style.display = 'block';
                return;
            }

            goToHapp(subLink);
        });
    });
</script>
</body>
</html>
