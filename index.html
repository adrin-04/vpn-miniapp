<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Import</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .btn {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn-happ {
            background-color: #2481cc;
            color: white;
        }
        .btn-qr {
            background-color: #333333;
            color: white;
        }
        #qr-container {
            margin-top: 20px;
            display: none;
        }
        #qr-container img {
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>VPN Schnell-Import</h2>
        <p>Wähle eine Option:</p>

        <button class="btn btn-happ" onclick="importToHapp()">🚀 In Happ App importieren</button>
        <button class="btn btn-qr" onclick="toggleQR()">📱 QR Code anzeigen</button>

        <div id="qr-container">
            <img id="qr-img" src="" alt="QR Code">
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Holt die Subscription-URL automatisch aus den URL-Parametern der Mini App
        const urlParams = new URLSearchParams(window.location.search);
        const subUrl = urlParams.get('sub') || "DEIN_STANDARD_LINK"; 

        function importToHapp() {
            const happLink = "happ://add/sub?url=" + encodeURIComponent(subUrl);
            window.location.href = happLink;
        }

        function toggleQR() {
            const qrContainer = document.getElementById('qr-container');
            const qrImg = document.getElementById('qr-img');
            
            if (qrContainer.style.display === "block") {
                qrContainer.style.display = "none";
            } else {
                qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(subUrl);
                qrContainer.style.display = "block";
            }
        }
    </script>
</body>
</html>
