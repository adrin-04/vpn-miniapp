<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Import</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f7);
            color: var(--tg-theme-text-color, #1c1c1e);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 24px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h2 { margin-top: 0; margin-bottom: 8px; font-size: 22px; }
        p { font-size: 14px; opacity: 0.7; margin-bottom: 20px; }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin-bottom: 12px;
        }
        .btn-happ {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background-color: #007aff;
            color: white;
            transition: opacity 0.2s ease;
        }
        .btn-happ:active {
            opacity: 0.8;
        }
        #status-msg {
            margin-top: 12px;
            font-size: 13px;
            color: #34c759;
            font-weight: 500;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Happ App Import</h2>
        <p>Paste your subscription link below</p>

        <!-- Input Field -->
        <input type="text" id="link-input" placeholder="Paste your link here...">

        <!-- Import Button -->
        <button class="btn-happ" id="import-btn" onclick="importToHapp()">🚀 Import to Happ App</button>
        
        <div id="status-msg"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Saved link auto-fill
        const savedUrl = localStorage.getItem('vpn_sub_url');
        if (savedUrl) {
            document.getElementById('link-input').value = savedUrl;
        }

        function importToHapp() {
            const inputVal = document.getElementById('link-input').value.trim();
            const statusMsg = document.getElementById('status-msg');
            
            if (!inputVal) {
                alert("Please paste your subscription link first!");
                return;
            }

            // Save link
            localStorage.setItem('vpn_sub_url', inputVal);

            const happUrl = "happ://add/sub?url=" + encodeURIComponent(inputVal);

            // 1. Always copy link to clipboard as a safety backup
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(inputVal);
            }

            // 2. Trigger native deep link via anchor element click
            try {
                const a = document.createElement('a');
                a.href = happUrl;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                statusMsg.innerText = "Opening Happ App... (Link copied to clipboard)";
                statusMsg.style.display = "block";
            } catch (e) {
                // Fallback
                window.location.href = happUrl;
            }
        }
    </script>
</body>
</html>
