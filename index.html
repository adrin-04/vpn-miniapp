<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Import</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f7);
            color: var(--tg-theme-text-color, #1c1c1e);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 24px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h2 { margin-top: 0; margin-bottom: 8px; font-size: 22px; }
        p { font-size: 14px; opacity: 0.7; margin-bottom: 20px; }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin-bottom: 12px;
            direction: ltr; /* Link bleibt linksbündig */
        }
        .btn-happ {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background-color: #007aff;
            color: white;
            transition: opacity 0.2s ease;
        }
        .btn-happ:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ورود به Happ App</h2>
        <p>لینک اشتراک خود را در زیر قرار دهید</p>

        <!-- Input Field -->
        <input type="text" id="link-input" placeholder="لینک خود را اینجا قرار دهید...">

        <!-- Import Button -->
        <button class="btn-happ" id="importBtn">🚀 افزودن به Happ App</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.getElementById('importBtn').addEventListener('click', () => {
            const subLink = document.getElementById('link-input').value.trim();
            if (!subLink) {
                alert("لطفاً ابتدا لینک اشتراک خود را وارد کنید!");
                return;
            }

            let happLink = subLink;
            if (!happLink.startsWith("happ://add/")) {
                happLink = "happ://add/" + subLink;
            }

            const bridgeUrl = 'https://adrin-04.github.io/vpn-miniapp/redirect.html?url=' + encodeURIComponent(happLink);

            tg.openLink(bridgeUrl, { try_instant_view: false, try_browser: 'chrome' });
        });
    </script>
</body>
</html>
