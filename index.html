<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Subscription</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f7);
            color: var(--tg-theme-text-color, #1c1c1e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 24px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h2 { margin-top: 0; margin-bottom: 8px; font-size: 22px; }
        p { font-size: 14px; opacity: 0.7; margin-bottom: 20px; }
        
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .btn-save {
            padding: 12px 16px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .url-box {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin-bottom: 16px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-happ { background-color: #007aff; color: white; }
        .btn-copy { background-color: #34c759; color: white; }
        .btn-qr { background-color: #8e8e93; color: white; }
        .btn-download { background-color: #5856d6; color: white; margin-top: 10px; }
        
        #qr-container {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0,0,0,0.1);
            display: none;
        }
        #qr-container img {
            width: 180px;
            height: 180px;
            border-radius: 12px;
            border: 1px solid #ddd;
            padding: 8px;
            background: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>VPN Setup</h2>
        <p>Enter your Subscription Link below</p>

        <!-- Dynamic Link Input -->
        <div class="input-group">
            <input type="text" id="link-input" placeholder="Paste your link here...">
            <button class="btn-save" onclick="saveCustomLink()">Save</button>
        </div>

        <!-- Display Area -->
        <div class="url-box" id="sub-url-text">No link saved yet.</div>

        <!-- Action Buttons -->
        <button class="btn btn-happ" onclick="importToHapp()">🚀 Import to Happ App</button>
        <button class="btn btn-copy" id="copy-btn" onclick="copyLink()">📋 Copy Subscription Link</button>
        <button class="btn btn-qr" onclick="toggleQR()">📱 Show QR Code</button>

        <!-- QR Code Section -->
        <div id="qr-container">
            <img id="qr-img" src="" alt="QR Code">
            <button class="btn btn-download" onclick="downloadQR()">💾 Download QR Code</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let subUrl = localStorage.getItem('vpn_sub_url') || "";

        function updateUI() {
            if (subUrl) {
                document.getElementById('sub-url-text').innerText = subUrl;
                document.getElementById('link-input').value = subUrl;
            } else {
                document.getElementById('sub-url-text').innerText = "Please paste and save your link above.";
            }
        }

        function saveCustomLink() {
            const val = document.getElementById('link-input').value.trim();
            if (val) {
                subUrl = val;
                localStorage.setItem('vpn_sub_url', subUrl);
                updateUI();
                alert("Link saved successfully!");
            }
        }

        function importToHapp() {
            if (!subUrl) return alert("Please save a link first!");
            window.location.href = "happ://add/sub?url=" + encodeURIComponent(subUrl);
        }

        function copyLink() {
            if (!subUrl) return alert("Please save a link first!");
            navigator.clipboard.writeText(subUrl).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerText = "✅ Link Copied!";
                setTimeout(() => btn.innerText = "📋 Copy Subscription Link", 2000);
            });
        }

        function toggleQR() {
            if (!subUrl) return alert("Please save a link first!");
            const container = document.getElementById('qr-container');
            const img = document.getElementById('qr-img');
            
            if (container.style.display === "block") {
                container.style.display = "none";
            } else {
                img.src = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(subUrl);
                container.style.display = "block";
            }
        }

        function downloadQR() {
            const img = document.getElementById('qr-img');
            if (!img.src) return;
            fetch(img.src)
                .then(res => res.blob())
                .then(blob => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = "vpn-qr-code.png";
                    link.click();
                });
        }

        updateUI();
    </script>
</body>
</html>
